<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>S7 OUTLET</title>

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        .landing {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 25px;
        }

        h1 {
            font-size: 55px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        p {
            margin-top: 15px;
            font-size: 19px;
            color: #ccc;
        }

        .contact-icons {
            display: flex;
            gap: 20px;
            margin-top: 35px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .contact-icons a {
            width: 55px;
            height: 55px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
            color: #111;
            border-radius: 50%;
            text-decoration: none;
            font-size: 24px;
            transition: 0.3s;
        }

        .contact-icons a:hover {
            background: #c9a227;
            color: white;
            transform: translateY(-5px);
        }

        .menu-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 35px;
            padding: 16px 35px;
            background: white;
            color: #111;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
            letter-spacing: 1px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .menu-button:hover {
            background: #c9a227;
            color: white;
            transform: translateY(-4px);
        }

        .footer {
            margin-top: 35px;
            font-size: 13px;
            color: #777;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 36px;
            }

            p {
                font-size: 16px;
            }

            .contact-icons {
                gap: 12px;
            }
        }
    </style>
</head>

<body>

    <section class="landing">

        <h1>S7 OUTLET</h1>

        <p>Clothing • Shoes • Bags • Accessories</p>

        <div class="contact-icons">

            <!-- Instagram -->
            <a href="https://www.instagram.com/s7outlet_lb?vrfl=dG1hMTNrM2doYnln"
               target="_blank" rel="noopener noreferrer">
                <i class="fab fa-instagram"></i>
            </a>

            <!-- Facebook -->
            <a href="https://www.facebook.com/share/1VSVUKjRVA/"
               target="_blank" rel="noopener noreferrer">
                <i class="fab fa-facebook-f"></i>
            </a>

            <!-- WhatsApp -->
            <a href="https://wa.me/96181262185"
               target="_blank" rel="noopener noreferrer">
                <i class="fab fa-whatsapp"></i>
            </a>

        </div>

        <div class="footer">
            THANK YOU FOR VISITING S7 OUTLET
        </div>

    </section>

</body>
</html>
